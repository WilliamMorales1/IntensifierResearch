[project]
name = "intensifier-research"
version = "0.1.0"
description = "Extract and classify Spanish intensifier tokens from POS-tagged sociolinguistic interviews."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "pandas>=2.0",
    "python-docx>=1.1",
    "stanza>=1.10",
]

[tool.pytest.ini_options]
pythonpath = ["pipeline"]
testpaths = ["tests"]

[tool.ruff]
src = ["pipeline"]
