[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "intensifier-research"
version = "0.2.0"
description = "Extract and classify Spanish intensifier tokens from POS-tagged sociolinguistic interviews."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "pandas>=2.0",
    "python-docx>=1.1",
    "stanza[transformers]==1.15.0",
    "torch>=2.6",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

# Scripts run from the repo, nothing to install; the empty package only lets pip pull the dependencies.
[tool.setuptools]
packages = []

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["pipeline"]
testpaths = ["tests"]

[tool.ruff]
src = ["pipeline"]
line-length = 120
